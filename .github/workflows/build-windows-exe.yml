name: Build Windows exe

# Fabrique StudioDock.exe sur une machine Windows de GitHub :
# - à chaque push : l'exe est disponible en artefact « StudioDock-windows » (onglet Actions) ;
# - à chaque release publiée (tag vX.Y.Z) : l'exe et un zip sont en plus joints à la release
#   (StudioDock-X.Y.Z.exe, StudioDock-X.Y.Z-windows.zip). Le tag doit correspondre au fichier VERSION.

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Studio Dock $version"
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            if [ "$tag" != "v$version" ]; then
              echo "::error::Le tag $tag ne correspond pas au fichier VERSION ($version). Lancer scripts/bump_version.py avant la release."
              exit 1
            fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Exécutable
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
          pyinstaller --noconfirm StudioDock.spec

      - name: Vérification
        run: |
          mkdir -p verif
          ./dist/StudioDock.exe --no-window --port 8599 --home "$PWD/verif" &
          for i in $(seq 90); do
            if curl -sf http://127.0.0.1:8599/health > health.json; then
              cat health.json; echo
              grep -q '"version":"${{ steps.version.outputs.version }}"' health.json || { echo "::error::Version inattendue"; exit 1; }
              curl -sf http://127.0.0.1:8599/api/apps | grep -q '"id":"specgen"' || { echo "::error::Liste des apps absente"; exit 1; }
              curl -sf http://127.0.0.1:8599/ | grep -q 'Studio Dock' || { echo "::error::Interface absente"; exit 1; }
              test -f verif/apps.json || { echo "::error::apps.json non créé"; exit 1; }
              exit 0
            fi
            sleep 1
          done
          echo "::error::L'exe ne répond pas sur /health"
          exit 1

      - name: Vérification de l'installation dans un dossier choisi
        run: |
          set -u
          attendre() { for i in $(seq 90); do curl -sf http://127.0.0.1:8597/health >/dev/null && return 0; sleep 1; done; return 1; }
          chemin_exe() { powershell -NoProfile -Command "(Get-Process StudioDock -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Path | Sort-Object -Unique) -join ';'"; }
          mkdir -p partage/StudioDock && cp dist/StudioDock.exe partage/StudioDock/
          printf '{"apps": []}' > partage/catalogue.json
          ./partage/StudioDock/StudioDock.exe --no-window --port 8597 &
          attendre || { echo "::error::L'exe du partage ne répond pas"; exit 1; }
          curl -sf http://127.0.0.1:8597/api/apps | grep -q '"needsInstall":true' || { echo "::error::Écran d'installation attendu"; exit 1; }
          # Un dossier dans le partage est refusé
          code=$(curl -s -o refus.json -w '%{http_code}' -X PUT -H 'Content-Type: application/json' \
            -d "{\"folder\": \"$(cygpath -w "$PWD/partage/perso" | sed 's/\\/\\\\/g')\"}" http://127.0.0.1:8597/api/settings/install)
          cat refus.json; echo
          test "$code" = 409 || { echo "::error::Dossier dans le partage accepté"; exit 1; }
          # Installation
          un='C:\\sd-poste-1'
          curl -sf -X PUT -H 'Content-Type: application/json' -d "{\"folder\": \"$un\"}" http://127.0.0.1:8597/api/settings/install
          echo; sleep 4; attendre || { echo "::error::Pas de redémarrage après installation"; exit 1; }
          test -f /c/sd-poste-1/StudioDock.exe || { echo "::error::Exe non copié"; exit 1; }
          echo "Processus : $(chemin_exe)"
          curl -sf http://127.0.0.1:8597/api/settings; echo
          curl -s -w ' [%{http_code}]' http://127.0.0.1:8597/api/apps | cut -c1-1500; echo
          tail -n 40 "$LOCALAPPDATA/StudioDock/logs/studiodock.log" 2>/dev/null || true
          chemin_exe | grep -qi 'sd-poste-1' || { echo "::error::Studio Dock ne tourne pas depuis le dossier choisi"; exit 1; }
          curl -sf http://127.0.0.1:8597/api/apps | grep -q '"needsInstall":false' || { echo "::error::Toujours à installer"; exit 1; }
          curl -sf http://127.0.0.1:8597/api/settings | grep -q 'partage' || { echo "::error::Dossier partagé non retenu"; exit 1; }
          ls "$APPDATA/Microsoft/Windows/Start Menu/Programs/" | grep -q 'Studio Dock' && echo "Raccourci créé" || echo "::warning::Raccourci du menu Démarrer non créé"
          # Déplacement avec une app installée
          mkdir -p /c/sd-poste-1/apps/specgen && echo test > /c/sd-poste-1/apps/specgen/SpecGenerator-1.0.0.exe
          deux='C:\\sd-poste-2'
          curl -sf -X PUT -H 'Content-Type: application/json' -d "{\"folder\": \"$deux\"}" http://127.0.0.1:8597/api/settings/install
          echo; sleep 4; attendre || { echo "::error::Pas de redémarrage après déplacement"; exit 1; }
          test -f /c/sd-poste-2/apps/specgen/SpecGenerator-1.0.0.exe || { echo "::error::Apps non déplacées"; exit 1; }
          for i in $(seq 30); do test -e /c/sd-poste-1/StudioDock.exe || break; sleep 1; done
          test ! -e /c/sd-poste-1/StudioDock.exe || { echo "::error::Ancien dossier non vidé"; exit 1; }
          echo "Processus : $(chemin_exe)"
          # Relancer l'exe du partage ouvre la copie installée
          powershell -NoProfile -Command "Stop-Process -Name StudioDock -Force"; sleep 2
          ./partage/StudioDock/StudioDock.exe --port 8597 --browser &
          sleep 8; echo "Processus : $(chemin_exe)"
          chemin_exe | grep -qi 'sd-poste-2' || { echo "::error::L'exe du partage n'a pas ouvert la copie installée"; exit 1; }
          powershell -NoProfile -Command "Stop-Process -Name StudioDock -Force"

      - name: Vérification de la fenêtre (WebView2)
        # Indicatif : la machine de GitHub n'a pas d'utilisateur connecté, la fenêtre peut y échouer
        continue-on-error: true
        run: |
          mkdir -p verif-fenetre
          timeout 120 ./dist/StudioDock.exe --check-window --port 8598 --home "$PWD/verif-fenetre"
          echo "Fenêtre ouverte et fermée (code $?)"

      - uses: actions/upload-artifact@v4
        with:
          name: StudioDock-windows
          path: dist/StudioDock.exe
          if-no-files-found: error

      - name: Joindre l'exe et le zip à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="StudioDock-${{ steps.version.outputs.version }}.exe"
          cp dist/StudioDock.exe "dist/$name"
          # Zip : l'exe et l'historique des versions ; au premier lancement, Studio Dock demande où s'installer.
          base="StudioDock-${{ steps.version.outputs.version }}-windows"
          mkdir -p "dist/zip/$base"
          cp dist/StudioDock.exe CHANGELOG.md "dist/zip/$base/"
          (cd dist/zip && python -m zipfile -c "../$base.zip" "$base")
          gh release upload "${{ github.event.release.tag_name }}" "dist/$name" "dist/$base.zip" --clobber
